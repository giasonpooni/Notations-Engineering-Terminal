name: Godot observation image capture
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Capture and unchanged native host/stateful/control contracts
        run: python -m pytest -q tests/test_simulation_capture.py tests/test_godot_simulation.py tests/test_simulation_control.py tests/test_simulation_campaign.py tests/test_control_plane.py -o addopts= --junitxml=capture-source.xml
      - run: python -m build --wheel
      - name: Installed contracts outside checkout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,pathlib,subprocess,sys,tempfile
          root=pathlib.Path.cwd()
          wheel=next((root/'dist').glob('*.whl'))
          subprocess.run([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(wheel)],check=True)
          env={k:v for k,v in os.environ.items() if k!='PYTHONPATH'}
          with tempfile.TemporaryDirectory() as tmp:
              probe=subprocess.check_output([sys.executable,'-I','-c','import ciw; print(ciw.__file__)'],cwd=tmp,env=env,text=True)
              assert not pathlib.Path(probe.strip()).resolve().is_relative_to(root)
              tests=['test_simulation_capture.py','test_godot_simulation.py','test_simulation_control.py','test_simulation_campaign.py']
              subprocess.run([sys.executable,'-I','-m','pytest','-q',*[str(root/'tests'/name) for name in tests],
                  '-o','pythonpath=','-o','addopts=','--junitxml='+str(root/'capture-installed.xml')],cwd=tmp,env=env,check=True)
          PY
      - name: Require all contract cases without skips
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for name,count in [('capture-source.xml',304),('capture-installed.xml',185)]:
              suites=list(ET.parse(name).getroot().iter('testsuite'))
              assert sum(int(s.attrib['tests']) for s in suites)==count
              assert all(int(s.attrib[k])==0 for s in suites for k in ('failures','errors','skipped'))
          PY
      - name: Provision original Godot and software-rendered display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
          mkdir -p "$RUNNER_TEMP/godot-capture"
          cd "$RUNNER_TEMP/godot-capture"
          curl --fail --location --retry 2 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          echo '87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03  godot.zip' | sha256sum --check
          unzip -q godot.zip
          chmod +x Godot_v4.5.2-stable_linux.x86_64
      - name: Actual images, source isolation and failed-render evidence
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot-capture/Godot_v4.5.2-stable_linux.x86_64"
          SHA="sha256:$(sha256sum "$GODOT" | cut -d' ' -f1)"
          xvfb-run -a -s '-screen 0 1600x1000x24' python -I validation/godot_observation_capture_native.py --godot "$GODOT" --godot-sha256 "$SHA" --output-dir capture-native
      - name: Rerun unchanged native campaign and replay acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot-capture/Godot_v4.5.2-stable_linux.x86_64"
          SHA="sha256:$(sha256sum "$GODOT" | cut -d' ' -f1)"
          python -I validation/godot_simulation_native.py --godot "$GODOT" --godot-sha256 "$SHA" --output-dir original-native-regression
      - name: Retain exact source and environment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=capture-source.zip HEAD
          python -m pip freeze > capture-environment.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: observation-capture-${{ matrix.os }}
          if-no-files-found: error
          path: |
            capture-source.xml
            capture-installed.xml
            capture-source.zip
            capture-environment.txt
            capture-native
            original-native-regression
            dist/*.whl
