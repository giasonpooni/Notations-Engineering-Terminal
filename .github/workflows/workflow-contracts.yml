name: Workflow contracts

on:
  push:
    branches: [main, 'release/**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check event policy and adversarial routing cases
        run: |
          python -m pip install -e ".[dev]"
          python -m unittest discover -s scripts/tests -p test_ci_policy.py -v
          python scripts/check_ci_policy.py
      - name: Audit scientific contract coverage and shared enforcement
        run: |
          python -m ciw.net catalog --audit --repository . --json
          python -m pytest -q tests/test_scientific_audit.py tests/test_operation_contract_enforcement.py tests/test_saved_result_discriminator.py tests/test_observation_origin_enforcement.py tests/test_control_plane.py tests/test_preservation_contracts.py
      - name: Validate workflow syntax and context availability
        run: |
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes=
