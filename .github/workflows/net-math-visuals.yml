name: NET mathematical and visual inspection
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspector:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: New mathematics and unchanged control/scientific regressions
        run: python -m pytest -q tests/test_math_inspector.py tests/test_information_display.py tests/test_scientific.py tests/test_control_plane.py tests/test_thermal_workflow.py tests/test_scientific_observations.py tests/test_check_suite.py tests/test_covariance_records.py tests/test_covariance_artifacts.py -o addopts= --junitxml=math-visual-contracts.xml
      - name: Require every contract case
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites=list(ET.parse('math-visual-contracts.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites)==428
          assert all(int(s.attrib[k])==0 for s in suites for k in ('failures','errors','skipped'))
          PY
      - run: python -m build --wheel
      - name: Installed wheel and real thermal mathematical demonstration
        shell: bash
        run: |
          python - <<'PY'
          import os,pathlib,subprocess,sys,tempfile
          root=pathlib.Path.cwd()
          wheel=next((root/'dist').glob('*.whl'))
          subprocess.run([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(wheel)],check=True)
          env={k:v for k,v in os.environ.items() if k!='PYTHONPATH'}
          with tempfile.TemporaryDirectory() as tmp:
              probe=subprocess.check_output([sys.executable,'-I','-c','import ciw; print(ciw.__file__)'],cwd=tmp,env=env,text=True)
              assert not pathlib.Path(probe.strip()).resolve().is_relative_to(root)
              for script,args in [
                  ('run_thermal_observation_demo.py',['--source',str(root/'examples/thermal-observations/source.json'),'--output-dir',str(root/'thermal-evidence')]),
                  ('run_math_visual_demo.py',['--evidence-dir',str(root/'thermal-evidence'),'--output-dir',str(root/'math-visual-evidence')]),
                  ('run_information_visual_demo.py',['--evidence-dir',str(root/'thermal-evidence'),'--output-dir',str(root/'information-evidence')])]:
                  subprocess.run([sys.executable,'-I',str(root/'scripts'/script),*args],cwd=tmp,env=env,check=True,timeout=120)
              subprocess.run([sys.executable,'-I','-m','pytest','-q',str(root/'tests/test_math_inspector.py'),str(root/'tests/test_information_display.py'),
                  '-o','pythonpath='+(root/'tests').as_posix(),'-o','addopts=',
                  '--junitxml='+str(root/'math-installed.xml')],cwd=tmp,env=env,check=True)
          PY
      - name: Provision actual Chromium for the optional browser test
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real browser controls, download, and responsive views
        if: matrix.os == 'ubuntu-latest'
        run: python -I validation/math_visual_browser.py --html math-visual-evidence/inspector.html --output-dir math-browser-evidence
      - name: Linked information geometry in actual Chromium
        if: matrix.os == 'ubuntu-latest'
        run: python -I validation/information_visual_browser.py --html information-evidence/inspector.html --output-dir information-browser-evidence
      - name: Require installed tests and actual browser qualification
        shell: bash
        run: |
          python - <<'PY'
          import json,os,pathlib,xml.etree.ElementTree as ET
          suites=list(ET.parse('math-installed.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites)==102
          assert all(int(s.attrib[k])==0 for s in suites for k in ('failures','errors','skipped'))
          if os.environ['RUNNER_OS']=='Linux':
              r=json.loads(pathlib.Path('math-browser-evidence/browser-report.json').read_text())
              assert r['status']=='passed' and r['count']==22 and r['document_mode']=='file'
              assert not r['errors'] and not r['network_requests']
              info=json.loads(pathlib.Path('information-browser-evidence/browser-report.json').read_text())
              assert info['status']=='passed' and info['count']==23 and info['document_mode']=='file'
              assert not info['errors'] and not info['network_requests']
          PY
      - name: Retain exact qualified public source
        if: matrix.os == 'ubuntu-latest'
        run: git archive --format=zip --output=math-visual-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: net-math-visual-${{ matrix.os }}
          if-no-files-found: error
          path: |
            math-visual-contracts.xml
            math-installed.xml
            math-visual-evidence
            math-browser-evidence
            information-evidence
            information-browser-evidence
            math-visual-source.zip
            dist/*.whl
