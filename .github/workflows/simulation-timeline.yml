name: Simulation evidence timeline
on:
  pull_request:
    paths:
      - 'src/ciw/simulation_timeline*.py'
      - 'src/ciw/simulation_cli.py'
      - 'src/ciw/web/simulation_timeline.*'
      - 'tests/test_simulation_timeline.py'
      - 'validation/simulation_timeline_browser.py'
      - '.github/workflows/simulation-timeline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timeline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Timeline and existing stateful capture contracts
        run: python -m pytest -q tests/test_simulation_timeline.py tests/test_simulation_capture.py tests/test_godot_simulation.py tests/test_simulation_control.py tests/test_simulation_campaign.py tests/test_control_plane.py -o addopts= --junitxml=timeline-source.xml
      - run: python -m build --wheel
      - name: Installed wheel outside checkout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,pathlib,subprocess,sys,tempfile,xml.etree.ElementTree as ET
          root=pathlib.Path.cwd()
          wheel=next((root/'dist').glob('*.whl'))
          subprocess.run([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(wheel)],check=True)
          env={k:v for k,v in os.environ.items() if k!='PYTHONPATH'}
          with tempfile.TemporaryDirectory() as temp:
              where=subprocess.check_output([sys.executable,'-I','-c','import ciw;print(ciw.__file__)'],cwd=temp,env=env,text=True)
              assert not pathlib.Path(where.strip()).resolve().is_relative_to(root)
              tests=['test_simulation_timeline.py','test_simulation_capture.py','test_godot_simulation.py','test_simulation_control.py','test_simulation_campaign.py']
              subprocess.run([sys.executable,'-I','-m','pytest','-q',*[str(root/'tests'/n) for n in tests],
                  '-o','pythonpath=','-o','addopts=','--junitxml='+str(root/'timeline-installed.xml')],cwd=temp,env=env,check=True)
          for path,count in [('timeline-source.xml',342),('timeline-installed.xml',223)]:
              suites=list(ET.parse(path).getroot().iter('testsuite'))
              assert sum(int(s.attrib['tests']) for s in suites)==count
              assert all(int(s.attrib[k])==0 for s in suites for k in ('failures','errors','skipped'))
          PY
      - name: Provision existing native and browser profiles
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/timeline-godot"
          cd "$RUNNER_TEMP/timeline-godot"
          curl --fail --location --retry 2 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          echo '87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03  godot.zip' | sha256sum --check
          unzip -q godot.zip
          chmod +x Godot_v4.5.2-stable_linux.x86_64
      - name: Generate actual native source and image evidence with unchanged drivers
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/timeline-godot/Godot_v4.5.2-stable_linux.x86_64"
          SHA="sha256:$(sha256sum "$GODOT" | cut -d' ' -f1)"
          xvfb-run -a -s '-screen 0 1600x1000x24' python -I validation/godot_observation_capture_native.py --godot "$GODOT" --godot-sha256 "$SHA" --output-dir timeline-capture-inputs
          python -I validation/godot_simulation_native.py --godot "$GODOT" --godot-sha256 "$SHA" --output-dir timeline-campaign-inputs
      - name: Build from those frozen files with native process creation forbidden
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import json,pathlib
          from unittest.mock import patch
          from ciw.simulation_timeline import build,inspect_bundle
          root=pathlib.Path.cwd()
          images=root/'timeline-capture-inputs'
          campaign=root/'timeline-campaign-inputs/demo'
          with patch('subprocess.Popen',side_effect=AssertionError('timeline cannot start a provider')):
              a=build(root/'timeline-captures',captures=[images/'demo'/n for n in ('current','delayed','unavailable')]+[images/'front'],workspaces=[images/'failed-render/workspace.json'])
              b=build(root/'timeline-campaign',workspaces=[campaign/'workspace.json'],reports=[campaign/'campaign.json',campaign/'replay.json'])
              assert inspect_bundle(root/'timeline-captures')['summary']==a
              assert inspect_bundle(root/'timeline-campaign')['summary']==b
          assert a['unique_executions']==20 and a['unique_results']==19 and a['checked_images']==4 and a['deduplicated_execution_copies']==75
          assert b['unique_executions']==87 and b['instance_count']==6
          assert json.loads((images/'native-capture-qualification.json').read_text())['count']==26
          native=json.loads((root/'timeline-campaign-inputs/qualification.json').read_text())
          assert native['status']=='passed' and len(native['checks'])==23
          (root/'timeline-integration.json').write_text(json.dumps({'status':'passed','captures':a,'campaign':b,'provider_execution_during_index':False},indent=2))
          PY
          python -I validation/simulation_timeline_browser.py --captures timeline-captures --campaign timeline-campaign --output-dir timeline-browser
      - name: Retain exact source and environment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=timeline-source.zip HEAD
          python -m pip freeze > timeline-environment.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: simulation-timeline-${{ matrix.os }}
          if-no-files-found: error
          path: |
            timeline-source.xml
            timeline-installed.xml
            timeline-source.zip
            timeline-environment.txt
            timeline-integration.json
            timeline-browser
            timeline-captures
            timeline-campaign
            timeline-capture-inputs
            timeline-campaign-inputs
            dist/*.whl
