name: IFC CSE interoperability runtime bridge
on:
  pull_request:
    paths:
      - 'src/ciw/bim_interop.py'
      - 'src/ciw/bim_interop_cli.py'
      - 'src/ciw/interop_ingress.py'
      - 'src/ciw/bim_quantity.py'
      - 'src/ciw/control_contracts.py'
      - 'src/ciw/net.py'
      - 'tests/test_bim_interop.py'
      - 'tests/test_interop_ingress.py'
      - 'tests/test_bim_quantity.py'
      - 'docs/BIM_INTEROP_RUNTIME.md'
      - '.github/workflows/bim-interop-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve exact source bytes and Windows long paths
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Check out the exact retained CSE source
        id: retained-provider
        shell: python
        run: |
          import os, re, sys
          from pathlib import Path
          root = Path.cwd().resolve()
          sys.path.insert(0, str(root))
          from scripts.monorepo import _retained, git, load_manifest, verify_imports, worktree_mutation_lock
          from scripts.provider_checkouts import validate_checkout
          pin = '4b74abda40bba3277de69bf61e9e09283ae2d5b3'
          if re.fullmatch(r'[0-9a-f]{40}', pin) is None:
              raise ValueError('A full reviewed provider revision is required')
          target = root / 'cse'
          verify_imports(root)
          module = next(item for item in load_manifest(root)['modules'] if item['role'] == 'cse')
          _retained(root, pin, module)
          with worktree_mutation_lock(root):
              git(root, 'worktree', 'add', '--detach', str(target), pin)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print('prepared=true', file=output)
          validate_checkout(target, pin)
      - name: Bind pinned CSE path
        shell: python
        run: |
          import os
          from pathlib import Path
          path = Path('cse').resolve()
          assert path.is_dir()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f'CIW_CSE_REPO={path}\n')
      - name: Runtime bridge and semantic regressions
        run: python -m pytest -q tests/test_bim_interop.py tests/test_interop_ingress.py tests/test_industrial_transition.py tests/test_preservation_contracts.py tests/test_bim_quantity.py tests/test_board_morphisms.py tests/test_finite_preservation.py tests/test_representation_interventions.py tests/test_representation_morphisms.py --junitxml=bim-interop-tests.xml
      - name: Require complete qualification
        shell: bash
        run: |
          python - <<'PYTHON'
          import xml.etree.ElementTree as E
          suites=list(E.parse('bim-interop-tests.xml').getroot().iter('testsuite'))
          count=sum(int(s.attrib['tests']) for s in suites)
          assert count >= 120
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures','errors','skipped'))
          PYTHON
          python scripts/check_ci_policy.py
          git diff --check
      - run: python -m build --wheel
      - name: Verify retained CSE source and remove its temporary worktree
        if: always() && steps.retained-provider.outputs.prepared == 'true'
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          root = Path.cwd().resolve()
          sys.path.insert(0, str(root))
          from scripts.monorepo import git, worktree_mutation_lock
          from scripts.provider_checkouts import validate_checkout
          target = root / 'cse'
          try:
              validate_checkout(target, '4b74abda40bba3277de69bf61e9e09283ae2d5b3')
          finally:
              with worktree_mutation_lock(root):
                  git(root, 'worktree', 'remove', '--force', str(target))
