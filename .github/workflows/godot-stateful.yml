name: Godot stateful campaign qualification
on:
  pull_request:
    paths:
      - 'src/ciw/godot_simulation*.py'
      - 'src/ciw/godot_runtime/**'
      - 'src/ciw/simulation_*.py'
      - 'tests/test_godot_simulation.py'
      - 'validation/godot_simulation_native.py'
      - '.github/workflows/godot-stateful.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: New host contracts and unchanged stateful controls
        run: python -m pytest -q tests/test_godot_simulation.py tests/test_simulation_control.py tests/test_simulation_campaign.py tests/test_control_plane.py -o addopts= --junitxml=godot-host-source.xml
      - run: python -m build --wheel
      - name: Installed host contracts outside source checkout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,pathlib,subprocess,sys,tempfile
          root=pathlib.Path.cwd()
          wheel=next((root/'dist').glob('*.whl'))
          subprocess.run([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(wheel)],check=True)
          env={k:v for k,v in os.environ.items() if k!='PYTHONPATH'}
          with tempfile.TemporaryDirectory() as tmp:
              probe=subprocess.check_output([sys.executable,'-I','-c','import ciw; print(ciw.__file__)'],cwd=tmp,env=env,text=True)
              assert not pathlib.Path(probe.strip()).resolve().is_relative_to(root)
              tests=['test_godot_simulation.py','test_simulation_control.py','test_simulation_campaign.py']
              subprocess.run([sys.executable,'-I','-m','pytest','-q',*[str(root/'tests'/x) for x in tests],
                  '-o','pythonpath=','-o','addopts=','--junitxml='+str(root/'godot-host-installed.xml')],cwd=tmp,env=env,check=True)
          PY
      - name: Provision exact existing Godot Linux version
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-stateful"
          cd "$RUNNER_TEMP/godot-stateful"
          curl --fail --location --retry 2 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          echo '87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03  godot.zip' | sha256sum --check
          unzip -q godot.zip
          chmod +x Godot_v4.5.2-stable_linux.x86_64
      - name: Run actual persistent Godot and campaign/replay gates
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot-stateful/Godot_v4.5.2-stable_linux.x86_64"
          SHA="sha256:$(sha256sum "$GODOT" | cut -d' ' -f1)"
          python -I validation/godot_simulation_native.py --godot "$GODOT" --godot-sha256 "$SHA" --output-dir godot-native-evidence
      - name: Require full host counts and retain exact source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,pathlib,xml.etree.ElementTree as ET
          for file,count in [('godot-host-source.xml',246),('godot-host-installed.xml',127)]:
              suites=list(ET.parse(file).getroot().iter('testsuite'))
              assert sum(int(s.attrib['tests']) for s in suites)==count
              assert all(int(s.attrib[k])==0 for s in suites for k in ('failures','errors','skipped'))
          if os.environ['RUNNER_OS']=='Linux':
              value=json.loads(pathlib.Path('godot-native-evidence/qualification.json').read_text())
              assert value['status']=='passed' and value['check_count']==23
          PY
          git archive --format=zip --output=godot-stateful-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: godot-stateful-${{ matrix.os }}
          if-no-files-found: error
          path: |
            godot-host-source.xml
            godot-host-installed.xml
            godot-stateful-source.zip
            godot-native-evidence
            dist/*.whl
