name: Shared calibrated window replay

on:
  push:
    branches: [main, 'release/**']
    tags: ['**']
    paths-ignore:
      - 'README.md'
      - 'docs/**/*.md'
      - 'deploy/**/*.md'
      - 'godot/**/*.md'
      - 'examples/**/README.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**/*.md'
      - 'deploy/**/*.md'
      - 'godot/**/*.md'
      - 'examples/**/README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  calibrated-window:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'setuptools>=77' wheel
      - name: Exercise isolated installed workbench and pinned native providers
        run: python scripts/check_public_provider_gate.py calibrated-window --output-dir results/calibrated-window
      - name: Show retained reports for evidence review
        if: always()
        run: >-
          python scripts/show_qualification_reports.py
          results/calibrated-window/original.json
          results/calibrated-window/replay.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: calibrated-window-${{ matrix.python }}
          path: results/calibrated-window
