name: NET DSP instrument boundary
on:
  pull_request:
    paths:
      - 'src/ciw/dsp*.py'
      - 'src/ciw/net.py'
      - 'src/ciw/control_*.py'
      - 'src/ciw/session.py'
      - 'src/ciw/operations/**'
      - 'src/ciw/core/**'
      - 'tests/test_dsp.py'
      - 'docs/DSP_INSTRUMENT.md'
      - '.github/workflows/dsp-instrument.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CIW_REQUIRE_DSP_NATIVE: '1'
      SCR_DSP_LIBRARY: ${{ github.workspace }}/build/libscr_dsp.so
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Provision the exact retained DSP source
        id: provision-dsp
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.monorepo import _retained, git, load_manifest, verify_imports, worktree_mutation_lock
          from scripts.provider_checkouts import validate_checkout
          root = Path.cwd()
          target = Path(os.environ['RUNNER_TEMP']) / 'dsp-source'
          pin = '91a6d3b37f28623332acd485e9f8a12953acf71e'
          verify_imports(root)
          module = next(item for item in load_manifest(root)['modules'] if item['role'] == 'scr')
          _retained(root, pin, module)
          with worktree_mutation_lock(root):
              git(root, 'worktree', 'add', '--detach', str(target), pin)
          validate_checkout(target, pin)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write(f'DSP_SOURCE_ROOT={target}\n')
          PY
      - name: Generate the exact binding and compile the specialist-owned kernel
        run: |
          python "$DSP_SOURCE_ROOT/tools/instrument_bindings.py" "$DSP_SOURCE_ROOT/instruments/dsp/interface.json" --output-dir build/dsp-bindings
          cmp build/dsp-bindings/scr_dsp.py src/ciw/dsp_abi.py
          g++ -std=c++17 -O2 -shared -fPIC -fno-fast-math -ffp-contract=off -I build/dsp-bindings "$DSP_SOURCE_ROOT/instruments/dsp/fir.cpp" -o "$SCR_DSP_LIBRARY"
          g++ --version > build/compiler-version.txt
          sha256sum "$SCR_DSP_LIBRARY" > build/library.sha256
      - name: New DSP and unchanged game, production and controller regressions
        run: python -m pytest -q tests/test_dsp.py tests/test_game_project.py tests/test_game_project_feedback.py tests/test_production.py tests/test_game_trace.py tests/test_game_session.py tests/test_game_retention.py tests/test_control_plane.py tests/test_interactive_contract.py tests/test_interactive_session.py --junitxml=dsp-source-tests.xml
      - run: python -m build --wheel
      - name: Installed wheel tests and real Session demo outside source imports
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,shutil,subprocess,sys,tempfile,xml.etree.ElementTree as E
          checkout=pathlib.Path.cwd()
          wheel=next((checkout/'dist').glob('*.whl'))
          subprocess.run([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(wheel)],check=True)
          report=checkout/'dsp-installed-tests.xml'
          output=checkout/'results/dsp-native'
          library=pathlib.Path(os.environ['SCR_DSP_LIBRARY'])
          digest='sha256:'+hashlib.sha256(library.read_bytes()).hexdigest()
          with tempfile.TemporaryDirectory() as tmp:
              root=pathlib.Path(tmp);shutil.copy2('tests/test_dsp.py',root/'test_dsp.py')
              env={k:v for k,v in os.environ.items() if k!='PYTHONPATH'}
              subprocess.run([sys.executable,'-c','import ciw.dsp; print(ciw.dsp.__file__); assert "site-packages" in ciw.dsp.__file__'],cwd=root,env=env,check=True)
              subprocess.run([sys.executable,'-m','pytest','-q',str(root),'--junitxml='+str(report)],cwd=root,env=env,check=True)
              subprocess.run([sys.executable,'-m','ciw.net','dsp','demo','--library',str(library),'--library-sha256',digest,'--output-dir',str(output)],cwd=root,env=env,check=True)
              subprocess.run([sys.executable,'-m','ciw.net','dsp','inspect',str(output/'workspace.json')],cwd=root,env=env,check=True)
          for filename,count in [('dsp-source-tests.xml',385),('dsp-installed-tests.xml',29)]:
              suites=list(E.parse(filename).getroot().iter('testsuite'))
              assert sum(int(s.attrib['tests']) for s in suites)>=count
              assert all(int(s.attrib[k])==0 for s in suites for k in ('failures','errors','skipped'))
          PY
      - name: Verify retained DSP source and remove its temporary worktree
        if: ${{ always() && steps.provision-dsp.outcome == 'success' }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.monorepo import git, worktree_mutation_lock
          from scripts.provider_checkouts import validate_checkout
          root = Path.cwd()
          target = Path(os.environ['DSP_SOURCE_ROOT'])
          try:
              validate_checkout(target, '91a6d3b37f28623332acd485e9f8a12953acf71e')
          finally:
              with worktree_mutation_lock(root):
                  git(root, 'worktree', 'remove', '--force', str(target))
          PY
      - name: Retain exact NET source; provider source remains separately owned
        if: always()
        run: git archive --format=zip --output=dsp-net-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: net-dsp-native-evidence
          if-no-files-found: error
          path: |
            dsp-*-tests.xml
            dsp-net-source.zip
            dist/*.whl
            build/dsp-bindings
            build/libscr_dsp.so
            build/compiler-version.txt
            build/library.sha256
            results/dsp-native
