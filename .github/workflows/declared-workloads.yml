name: Shared schematic and numerical workloads

on:
  push:
    branches: [main, 'release/**']
    tags: ['**']
    paths-ignore:
      - 'README.md'
      - 'docs/**/*.md'
      - 'deploy/**/*.md'
      - 'godot/**/*.md'
      - 'examples/**/README.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**/*.md'
      - 'deploy/**/*.md'
      - 'godot/**/*.md'
      - 'examples/**/README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  declared-workloads:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
      - run: python -m pip install 'setuptools>=77' wheel
      - name: Exercise installed workbench with pinned SRA and native Rust SCR
        run: python scripts/check_public_provider_gate.py declared-workloads --output-dir results/declared-workloads
      - name: Show retained reports for evidence review
        if: always()
        run: >-
          python scripts/show_qualification_reports.py
          results/declared-workloads/schematic-assessment/original.json
          results/declared-workloads/schematic-assessment/replay.json
          results/declared-workloads/numerical-heat/original.json
          results/declared-workloads/numerical-heat/replay.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: declared-workload-native-replay
          path: results/declared-workloads
