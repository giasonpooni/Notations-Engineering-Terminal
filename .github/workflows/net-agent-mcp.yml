name: NET agent MCP boundary
on:
  pull_request:
    paths:
      - 'src/ciw/agent_*.py'
      - 'tests/test_agent_protocol.py'
      - 'scripts/check_agent_mcp.py'
      - 'docs/NET_AGENT_PROTOCOL.md'
      - 'examples/agents/**'
      - '.github/workflows/net-agent-mcp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install candidate and test-only independent MCP client
        run: python -m pip install -e '.[dev]' build mcp==1.26.0
      - name: Agent contracts and unchanged control/check regressions
        run: python -m pytest -q tests/test_agent_protocol.py tests/test_control_plane.py tests/test_check_suite.py -o addopts= --junitxml=agent-contracts.xml
      - run: python -m build --wheel
      - name: Installed wheel and independent MCP SDK process
        shell: bash
        run: |
          python - <<'PY'
          import os,pathlib,subprocess,sys,tempfile
          root=pathlib.Path.cwd()
          wheel=next((root/'dist').glob('*.whl'))
          subprocess.run([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(wheel)],check=True)
          env={k:v for k,v in os.environ.items() if k!='PYTHONPATH'}
          with tempfile.TemporaryDirectory() as tmp:
              location=subprocess.check_output([sys.executable,'-I','-c','import ciw.agent_api; print(ciw.agent_api.__file__)'],cwd=tmp,env=env,text=True)
              assert not pathlib.Path(location.strip()).resolve().is_relative_to(root)
              subprocess.run([sys.executable,'-I','-m','pytest','-q',str(root/'tests/test_agent_protocol.py'),
                  '-o','pythonpath=','-o','addopts=','--junitxml='+str(root/'agent-installed.xml')],cwd=tmp,env=env,check=True)
              subprocess.run([sys.executable,'-I',str(root/'scripts/check_agent_mcp.py'),
                  '--output-dir',str(root/'agent-sdk-evidence')],cwd=tmp,env=env,check=True,timeout=120)
          PY
      - name: Refuse skipped or missing qualification
        shell: bash
        run: |
          python - <<'PY'
          import json,xml.etree.ElementTree as ET
          for path,count in [('agent-contracts.xml',236),('agent-installed.xml',68)]:
              suites=list(ET.parse(path).getroot().iter('testsuite'))
              assert sum(int(s.attrib['tests']) for s in suites)==count
              assert all(int(s.attrib[k])==0 for s in suites for k in ('failures','errors','skipped'))
          report=json.load(open('agent-sdk-evidence/report.json'))
          assert report['status']=='passed' and report['check_count']==14
          assert len(set(report['execution_ids']))==3
          PY
      - name: Retain exact public source
        run: git archive --format=zip --output=agent-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: net-agent-${{ matrix.os }}
          if-no-files-found: error
          path: |
            agent-contracts.xml
            agent-installed.xml
            agent-sdk-evidence/
            agent-source.zip
            dist/*.whl
