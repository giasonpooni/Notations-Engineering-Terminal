name: Stateful simulation study contracts
on:
  pull_request:
    paths:
      - 'src/ciw/simulation*.py'
      - 'src/ciw/persistent_native.py'
      - 'src/ciw/net.py'
      - 'src/ciw/control_*.py'
      - 'tests/test_simulation_study.py'
      - 'scripts/check_simulation_study_native.py'
      - '.github/workflows/simulation-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Study contracts and preserved numerical/control regressions
        shell: bash
        run: |
          python -m pytest tests/test_simulation_study.py -q --junitxml=study-contracts.xml
          python -m pytest tests/test_control_plane.py tests/test_scientific.py tests/test_scientific_observations.py tests/test_check_suite.py tests/test_math_inspector.py tests/test_information_display.py -q --junitxml=study-regressions.xml
      - name: Require all cases, no optional-native success substitution
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as E
          for path, count in [('study-contracts.xml',54),('study-regressions.xml',357)]:
              suites=list(E.parse(path).getroot().iter('testsuite'))
              assert sum(int(s.attrib['tests']) for s in suites)==count
              assert all(int(s.attrib[k])==0 for s in suites for k in ('failures','errors','skipped'))
          PY
      - run: python -m build --wheel
      - name: Installed wheel outside source imports
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, tempfile, subprocess, sys, shutil
          root=pathlib.Path.cwd()
          wheel=next((root/'dist').glob('*.whl'))
          subprocess.run([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(wheel)],check=True)
          with tempfile.TemporaryDirectory() as tmp:
              target=pathlib.Path(tmp)
              shutil.copyfile(root/'tests/test_simulation_study.py',target/'test_simulation_study.py')
              (target/'pytest.ini').write_text('[pytest]\n')
              subprocess.run([sys.executable,'-I','-m','pytest','-c','pytest.ini','test_simulation_study.py','-q','--junitxml='+str(root/'study-installed.xml')],cwd=target,check=True)
              subprocess.run([sys.executable,'-I','-m','ciw.net','simulate','describe'],cwd=target,check=True)
          PY
      - name: Retain exact source
        run: git archive --format=zip --output=study-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: net-stateful-study-${{ matrix.os }}
          if-no-files-found: error
          path: |
            study-*.xml
            study-source.zip
            dist/*.whl
