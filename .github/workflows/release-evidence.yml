name: NET release evidence

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    paths:
      - 'scripts/check_release_evidence.py'
      - 'tests/test_release_evidence.py'
      - 'release/**'
      - '.github/workflows/release-evidence.yml'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full immutable commit SHA to assess (empty runs only gate tests)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  gate-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Exercise adversarial release evidence cases
        run: python -m unittest discover -s tests -p test_release_evidence.py -v
      - name: Validate the checked-in policy
        run: python -c "import runpy; m = runpy.run_path('scripts/check_release_evidence.py'); m['validate_policy'](m['read_json']('release/qualification-policy.json'))"

  collect-candidate:
    if: (github.event_name == 'workflow_dispatch' && inputs.candidate_sha != '') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    needs: gate-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Collect exact-candidate metadata without dispatching providers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: python scripts/check_release_evidence.py --sha "$CANDIDATE_SHA" --output results/release-evidence
      - name: Show the exact-candidate evidence report
        if: always()
        run: python scripts/show_qualification_reports.py results/release-evidence/report.json
      - name: Retain passing or blocked evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: net-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/release-evidence/
          if-no-files-found: error
