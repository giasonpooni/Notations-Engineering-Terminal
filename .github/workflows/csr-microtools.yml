name: NET CSR micro-tool qualification
on:
  pull_request:
    paths:
      - 'src/ciw/csr_microtools.py'
      - 'src/ciw/net.py'
      - 'tests/test_csr_microtools.py'
      - 'scripts/check_csr_microtools_native.py'
      - '.github/workflows/csr-microtools.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  microtools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve long paths and exact fixture bytes
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Unchanged controller plus micro-tool contracts
        shell: bash
        run: |
          python -m pytest tests/test_csr_microtools.py -q --junitxml=microtools-contracts.xml
          python -m pytest tests/test_control_plane.py tests/test_scientific.py tests/test_scientific_observations.py tests/test_check_suite.py tests/test_math_inspector.py tests/test_information_display.py -q --junitxml=microtools-regressions.xml
      - run: python -m build --wheel
      - name: Installed NET wheel outside checkout, then real CSR execution and reproduction
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, shutil, subprocess, sys, tempfile
          from scripts.monorepo import provider_worktrees
          from scripts.provider_checkouts import validate_checkout
          root = pathlib.Path.cwd()
          wheel = next((root / 'dist').glob('*.whl'))
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)
          env = {k:v for k,v in os.environ.items() if k != 'PYTHONPATH'}
          pin = '0b00e837c2df3206a3d38b497799f85b72de80f7'
          with provider_worktrees(root, roles=['csg'], overrides={'csg': pin}) as providers, tempfile.TemporaryDirectory() as tmp:
              provider = providers['csg']
              validate_checkout(provider, pin)
              target = pathlib.Path(tmp)
              shutil.copyfile(root / 'tests/test_csr_microtools.py', target / 'test_csr_microtools.py')
              (target / 'pytest.ini').write_text('[pytest]\n')
              probe = subprocess.run([sys.executable, '-I', '-c', 'import ciw; print(ciw.__file__)'], cwd=target, env=env, capture_output=True, text=True, check=True)
              assert not pathlib.Path(probe.stdout.strip()).resolve().is_relative_to(root)
              subprocess.run([sys.executable, '-I', '-m', 'pytest', '-c', 'pytest.ini', 'test_csr_microtools.py', '-q', '--junitxml=' + str(root / 'microtools-installed.xml')], cwd=target, env=env, check=True)
              subprocess.run([sys.executable, '-I', '-m', 'ciw.net', 'tools', 'catalog'], cwd=target, env=env, check=True)
              subprocess.run([sys.executable, '-I', str(root / 'scripts/check_csr_microtools_native.py'), '--csr-root', str(provider), '--csr-revision', '0b00e837c2df3206a3d38b497799f85b72de80f7', '--output-dir', str(root / 'native-evidence')], cwd=target, env=env, check=True)
              validate_checkout(provider, pin)
          PY
      - name: Require complete evidence, not skips
        shell: bash
        run: |
          python - <<'PY'
          import json, xml.etree.ElementTree as E
          for file, count in [('microtools-contracts.xml',41), ('microtools-installed.xml',41), ('microtools-regressions.xml',357)]:
              suites = list(E.parse(file).getroot().iter('testsuite'))
              assert sum(int(s.attrib['tests']) for s in suites) == count
              assert all(int(s.attrib[k]) == 0 for s in suites for k in ['errors','failures','skipped'])
          report = json.load(open('native-evidence/qualification.json'))
          assert report['status'] == 'PASS' and report['operations_checked'] == 3 and report['actual_executions'] == 6
          PY
      - name: Retain exact NET source
        if: always()
        run: git archive --format=zip --output=net-microtools-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: net-csr-microtools-${{ matrix.os }}
          if-no-files-found: error
          path: |
            microtools-*.xml
            native-evidence/
            net-microtools-source.zip
            dist/*.whl
