name: Typed workflow algebra compiler
on:
  pull_request:
    paths:
      - 'src/ciw/workflow_algebra.py'
      - 'src/ciw/workflow_production.py'
      - 'src/ciw/workflow_cli.py'
      - 'src/ciw/workcell.py'
      - 'src/ciw/net.py'
      - 'src/ciw/control_*.py'
      - 'src/ciw/production*.py'
      - 'src/ciw/operations/**'
      - 'tests/test_workflow_algebra.py'
      - 'tests/test_workflow_production.py'
      - 'tests/test_workflow_cli.py'
      - 'examples/workflow-algebra/**'
      - 'docs/WORKFLOW_ALGEBRA.md'
      - '.github/workflows/net-workflow-algebra.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Algebra plus unchanged agent workcell production and controller contracts
        run: python -m pytest -q tests/test_workflow_algebra.py tests/test_workflow_production.py tests/test_workflow_cli.py tests/test_agent_experiment.py tests/test_agent_transcript.py tests/test_workcell.py tests/test_workcell_snapshot.py tests/test_workcell_smith.py tests/test_foundry_pipeline.py tests/test_foundry.py tests/test_production.py tests/test_game_trace.py tests/test_game_session.py tests/test_game_retention.py tests/test_control_plane.py tests/test_interactive_contract.py tests/test_interactive_session.py tests/test_agent_protocol.py tests/test_computational_objects.py tests/test_computational_source.py --junitxml=algebra-source.xml
      - run: python -m build --wheel
      - name: Installed package law tests and real built-in execution outside checkout
        shell: bash
        run: |
          python - <<'PY'
          import os,pathlib,shutil,subprocess,sys,tempfile,xml.etree.ElementTree as E
          root=pathlib.Path.cwd()
          wheel=next((root/'dist').glob('*.whl'))
          subprocess.run([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(wheel)],check=True)
          env={k:v for k,v in os.environ.items() if k!='PYTHONPATH'}
          env['NET_WORKCELL_TEST_ROOT']=str(root)
          with tempfile.TemporaryDirectory() as directory:
              temp=pathlib.Path(directory)
              for name in ('test_workflow_algebra.py','test_workflow_production.py','test_workflow_cli.py','test_workcell.py'):
                  shutil.copy2(root/'tests'/name,temp/name)
              subprocess.run([sys.executable,'-I','-c','import ciw.workflow_algebra; assert "site-packages" in ciw.workflow_algebra.__file__'],cwd=temp,env=env,check=True)
              subprocess.run([sys.executable,'-m','pytest','-q','test_workflow_algebra.py','test_workflow_production.py','test_workflow_cli.py','--junitxml='+str(root/'algebra-installed.xml')],cwd=temp,env=env,check=True)
              subprocess.run([sys.executable,'-I','-m','ciw.workflow_cli','demo','--output-dir',str(root/'results/algebra-demo')],cwd=temp,env=env,check=True)
              for name in ('graph-compilation.json','production-compilation.json'):
                  subprocess.run([sys.executable,'-I','-m','ciw.workflow_cli','inspect',str(root/'results/algebra-demo'/name)],cwd=temp,env=env,check=True)
          for path,count in [('algebra-source.xml',755),('algebra-installed.xml',85)]:
              suites=list(E.parse(path).getroot().iter('testsuite'))
              assert sum(int(s.attrib['tests']) for s in suites)==count
              assert all(int(s.attrib[k])==0 for s in suites for k in ('failures','errors','skipped'))
          PY
          git diff --check
      - name: Retain exact compiler source even on failure
        if: always()
        run: git archive --format=zip --output=algebra-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workflow-algebra-${{ matrix.os }}
          if-no-files-found: error
          path: |
            algebra-*.xml
            algebra-source.zip
            dist/*.whl
            results/algebra-demo
