name: Stateful simulation reference contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: New reference contracts and existing controls
        run: python -m pytest -q tests/test_simulation_control.py tests/test_simulation_campaign.py tests/test_control_plane.py -o addopts= --junitxml=stateful-source.xml
      - run: python -m build --wheel
      - name: Installed reference workload outside checkout
        shell: bash
        run: |
          python - <<'PY'
          import os,pathlib,subprocess,sys,tempfile
          root=pathlib.Path.cwd()
          wheel=next((root/'dist').glob('*.whl'))
          subprocess.run([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(wheel)],check=True)
          env={k:v for k,v in os.environ.items() if k!='PYTHONPATH'}
          with tempfile.TemporaryDirectory() as tmp:
              probe=subprocess.check_output([sys.executable,'-I','-c','import ciw; print(ciw.__file__)'],cwd=tmp,env=env,text=True)
              assert not pathlib.Path(probe.strip()).resolve().is_relative_to(root)
              subprocess.run([sys.executable,'-I','-m','pytest','-q',str(root/'tests/test_simulation_control.py'),str(root/'tests/test_simulation_campaign.py'),
                  '-o','pythonpath=','-o','addopts=','--junitxml='+str(root/'stateful-installed.xml')],cwd=tmp,env=env,check=True)
              for args in [
                  ['demo','--output-dir',str(root/'stateful-evidence')],
                  ['inspect',str(root/'stateful-evidence/workspace.json')],
                  ['check-replay',str(root/'stateful-evidence/replay.json')],
                  ['campaign-demo','--output-dir',str(root/'campaign-evidence')],
                  ['campaign-check',str(root/'campaign-evidence/campaign.json')],
                  ['campaign-reference',str(root/'campaign-evidence/workspace.json'),'--plan',str(root/'campaign-evidence/plan.json'),'--output-dir',str(root/'campaign-repeat')]]:
                  subprocess.run([sys.executable,'-I','-m','ciw.net','simulation',*args],cwd=tmp,env=env,check=True)
              import hashlib
              report=root/'campaign-evidence/campaign.json'
              digest='sha256:'+hashlib.sha256(report.read_bytes()).hexdigest()
              subprocess.run([sys.executable,'-I','-m','ciw.net','simulation','campaign-view',str(report),
                  '--expected-sha256',digest,'--output',str(root/'campaign-evidence/inspector.html')],cwd=tmp,env=env,check=True)
          PY
      - name: Provision actual Chromium for optional display qualification
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Inspect the actual generated campaign file
        if: runner.os == 'Linux'
        run: python -I validation/simulation_campaign_browser.py --html campaign-evidence/inspector.html --output-dir campaign-browser
      - name: Require all reference cases without skips
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,xml.etree.ElementTree as ET
          for file,count in [('stateful-source.xml',221),('stateful-installed.xml',102)]:
              suites=list(ET.parse(file).getroot().iter('testsuite'))
              assert sum(int(s.attrib['tests']) for s in suites)==count
              assert all(int(s.attrib[k])==0 for s in suites for k in ('failures','errors','skipped'))
          r=json.loads(pathlib.Path('stateful-evidence/summary.json').read_text())
          assert r['reference_only'] and r['parent_unchanged'] and r['replay']['status']=='PASS'
          assert r['branch_comparison']['status']=='FAIL' and r['branch_comparison']['metrics']['max_abs_error']==8
          assert r['player_latest_sample_s']==4 and r['debugger_latest_sample_s']==6
          from ciw.simulation_campaign import read_campaign
          for path in ('campaign-evidence/campaign.json','campaign-repeat/campaign.json'):
              campaign=read_campaign(pathlib.Path(path))
              assert campaign['summary']['execution_count']==39
              assert [c['comparison']['outcome']['metrics']['max_abs_error'] for c in campaign['comparisons']]==[8,8,16]
          import os
          if os.environ['RUNNER_OS']=='Linux':
              browser=json.loads(pathlib.Path('campaign-browser/browser-report.json').read_text())
              assert browser['status']=='passed' and browser['count']==11 and browser['document_mode']=='file'
              assert browser['errors']==[]
          PY
      - name: Retain exact public source
        run: git archive --format=zip --output=stateful-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stateful-reference-${{ matrix.os }}
          if-no-files-found: error
          path: |
            stateful-source.xml
            stateful-installed.xml
            stateful-source.zip
            stateful-evidence
            campaign-evidence
            campaign-repeat
            campaign-browser
            dist/*.whl
