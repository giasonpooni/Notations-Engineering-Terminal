name: NET control primitives
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' build
      - name: Contracts and existing Session integration
        run: python -m pytest -q tests/test_control_plane.py -o addopts= --junitxml=net-control.xml
      - name: Require every qualification case
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse('net-control.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites) == 119
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures', 'errors', 'skipped'))
          PY
      - run: python -m build --wheel
      - name: Installed wheel entry point outside the checkout
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys, tempfile
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)
          with tempfile.TemporaryDirectory() as tmp:
              env = {k: v for k, v in os.environ.items() if k != 'PYTHONPATH'}
              import shutil
              exe = shutil.which('net')
              assert exe, 'Installed net entry point missing'
              for args in (['providers'], ['capabilities', 'analyze'],
                           ['demo', '--output-dir', 'demo'],
                           ['inspect', 'demo/workspace.json'],
                           ['inspect', 'demo/graph-run.json'],
                           ['compare', 'demo/observations.json', 'demo/observations.json', '--atol', '0']):
                  subprocess.run([exe, *args], cwd=tmp, env=env, check=True)
          PY
      - name: Retain exact public qualification source
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: git archive --format=zip --output=net-control-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: net-control-${{ matrix.os }}-${{ matrix.python }}
          if-no-files-found: error
          path: |
            net-control.xml
            net-control-source.zip
            dist/*.whl
