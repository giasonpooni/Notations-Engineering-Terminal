name: Synthetic FSRT retained view
on:
  pull_request:
    paths:
      - 'src/ciw/**'
      - 'tests/test*fsrt*'
      - 'tests/test_interactive*'
      - 'validation/*fsrt*'
      - '.github/workflows/synthetic-fsrt-view.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Unchanged approved FSRT and Godot runtime
        id: provision-fsrt
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.monorepo import _retained, git, load_manifest, verify_imports, worktree_mutation_lock
          from scripts.provider_checkouts import validate_checkout
          root = Path.cwd()
          target = Path(os.environ['RUNNER_TEMP']) / 'fsrt'
          pin = '09a756dd9cdd3a9bb6cb14b5cd498f6259937ac2'
          verify_imports(root)
          module = next(item for item in load_manifest(root)['modules'] if item['role'] == 'fsrt')
          _retained(root, pin, module)
          with worktree_mutation_lock(root):
              git(root, 'worktree', 'add', '--detach', str(target), pin)
          validate_checkout(target, pin)
          PY
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          echo "87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.5.2-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.5.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          echo "CIW_FSRT_REPO=$RUNNER_TEMP/fsrt" >> "$GITHUB_ENV"
      - name: Combined unchanged contracts and new public input checks
        run: >-
          python -m pytest -q tests/test_interactive_contract.py tests/test_interactive_session.py
          tests/test_simulated_fsrt.py tests/test_covariance_records.py tests/test_covariance_artifacts.py
          tests/test_fsrt_view.py tests/test_simulated_fsrt_view.py -o addopts= --junitxml=combined-contracts.xml
      - name: Actual Godot source and FSRT estimator
        env:
          CIW_SIMULATED_FSRT_OUT: ${{ runner.temp }}/simulated-fsrt-evidence
        run: python -m pytest -q validation/simulated_fsrt_integration.py -o addopts= --junitxml=simulated-fsrt.xml
      - name: Provider-free synthetic export and exact retained views
        env:
          CIW_SYNTHETIC_VIEW_FIXTURES: ${{ runner.temp }}/simulated-fsrt-evidence
          CIW_SYNTHETIC_VIEW_OUT: ${{ runner.temp }}/synthetic-views
        run: python -m pytest -q validation/simulated_fsrt_view_integration.py -o addopts= --junitxml=synthetic-export.xml
      - name: Require complete scoped evidence
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for path,count in [('combined-contracts.xml',180),('simulated-fsrt.xml',14),('synthetic-export.xml',21)]:
              suites=list(ET.parse(path).getroot().iter('testsuite'))
              assert sum(int(s.attrib['tests']) for s in suites)==count,(path,suites)
              assert all(int(s.attrib[k])==0 for s in suites for k in ('failures','errors','skipped')),path
          PY
      - run: python -m build --wheel
      - name: Verify retained FSRT source and remove its temporary worktree
        if: ${{ always() && steps.provision-fsrt.outcome == 'success' }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.monorepo import git, worktree_mutation_lock
          from scripts.provider_checkouts import validate_checkout
          root = Path.cwd()
          target = Path(os.environ['RUNNER_TEMP']) / 'fsrt'
          try:
              validate_checkout(target, '09a756dd9cdd3a9bb6cb14b5cd498f6259937ac2')
          finally:
              with worktree_mutation_lock(root):
                  git(root, 'worktree', 'remove', '--force', str(target))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetic-fsrt-view-evidence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/synthetic-views
            ${{ runner.temp }}/simulated-fsrt-evidence
            combined-contracts.xml
            simulated-fsrt.xml
            synthetic-export.xml
            dist/*.whl
