name: Real IFC execution and transition
on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'src/ciw/ifc_transition.py'
      - 'src/ciw/ifc_subset_verifier.py'
      - 'src/ciw/interop_cli.py'
      - 'src/ciw/bim_quantity.py'
      - 'src/ciw/interop_ingress.py'
      - 'src/ciw/industrial_transition.py'
      - 'src/ciw/preservation_contracts.py'
      - 'src/ciw/adapters/**'
      - 'tests/test_ifc_transition.py'
      - 'tests/test_ifc_subset_verifier.py'
      - 'tests/test_bim_quantity.py'
      - 'examples/ifc-transition/**'
      - 'scripts/check_real_ifc_transition.py'
      - 'docs/REAL_IFC_TRANSITION.md'
      - '.github/workflows/real-ifc-transition.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real-ifc-transition-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CIW_CSE_REPO: ${{ github.workspace }}/providers/cse
    steps:
      - name: Preserve pinned provider bytes on every host
        shell: bash
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check out the exact retained CSE source
        id: retained-provider
        shell: python
        run: |
          import os, re, sys
          from pathlib import Path
          root = Path.cwd().resolve()
          sys.path.insert(0, str(root))
          from scripts.monorepo import _retained, git, load_manifest, verify_imports, worktree_mutation_lock
          from scripts.provider_checkouts import validate_checkout
          pin = '4b74abda40bba3277de69bf61e9e09283ae2d5b3'
          if re.fullmatch(r'[0-9a-f]{40}', pin) is None:
              raise ValueError('A full reviewed provider revision is required')
          target = root / 'providers/cse'
          verify_imports(root)
          module = next(item for item in load_manifest(root)['modules'] if item['role'] == 'cse')
          _retained(root, pin, module)
          with worktree_mutation_lock(root):
              git(root, 'worktree', 'add', '--detach', str(target), pin)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print('prepared=true', file=output)
          validate_checkout(target, pin)
      - run: python -m pip install -e '.[dev]' build
      - name: Native IFC mapping, independent verification and inherited contracts
        run: python -m pytest -q tests/test_ifc_transition.py tests/test_ifc_subset_verifier.py tests/test_bim_quantity.py tests/test_interop_ingress.py tests/test_industrial_transition.py tests/test_preservation_contracts.py tests/test_board_morphisms.py tests/test_finite_preservation.py tests/test_representation_interventions.py tests/test_representation_morphisms.py tests/test_needle.py tests/test_system_board.py tests/test_parameter_program.py tests/test_semantic_capabilities.py tests/test_covariance_artifacts.py tests/test_covariance_records.py tests/test_thermal_contract.py --junitxml=ifc-tests.xml
      - name: Require complete qualification and retain source/environment identities
        shell: bash
        run: |
          python - <<'PYTHON'
          import json, platform, subprocess, sys
          import xml.etree.ElementTree as E
          from pathlib import Path
          import numpy
          suites = list(E.parse('ifc-tests.xml').getroot().iter('testsuite'))
          count = sum(int(s.attrib['tests']) for s in suites)
          assert count >= 338
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures', 'errors', 'skipped'))
          provider = subprocess.check_output(['git', '-C', 'providers/cse', 'rev-parse', 'HEAD'], text=True).strip()
          assert provider == '4b74abda40bba3277de69bf61e9e09283ae2d5b3'
          report = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'cse_commit': provider, 'python': sys.version, 'platform': platform.platform(),
                    'numpy': numpy.__version__, 'tests': count, 'failures': 0, 'errors': 0, 'skipped': 0}
          Path('qualification.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          PYTHON
          python scripts/check_ci_policy.py
          git diff --check
      - name: Retain actual positive and original public-model refusal evidence
        run: python scripts/check_real_ifc_transition.py --cse providers/cse --output-dir results/ifc-transition
      - run: python -m build --wheel
      - name: Retain exact tracked source
        shell: bash
        run: |
          git archive --format=zip --output=terminal-source.zip HEAD
          git -C providers/cse archive --format=zip --output="$GITHUB_WORKSPACE/cse-source.zip" HEAD
      - name: Verify retained CSE source and remove its temporary worktree
        if: always() && steps.retained-provider.outputs.prepared == 'true'
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          root = Path.cwd().resolve()
          sys.path.insert(0, str(root))
          from scripts.monorepo import git, worktree_mutation_lock
          from scripts.provider_checkouts import validate_checkout
          target = root / 'providers/cse'
          try:
              validate_checkout(target, '4b74abda40bba3277de69bf61e9e09283ae2d5b3')
          finally:
              with worktree_mutation_lock(root):
                  git(root, 'worktree', 'remove', '--force', str(target))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-ifc-transition-${{ matrix.os }}
          path: |
            terminal-source.zip
            cse-source.zip
            ifc-tests.xml
            qualification.json
            dist/*.whl
            results/ifc-transition/**
          if-no-files-found: error
          retention-days: 14
