name: Installed operator readiness

on:
  push:
    branches: [main, 'release/**']
    tags: ['**']
  pull_request:
    paths:
      - 'src/ciw/**'
      - 'tests/test_operator*.py'
      - 'scripts/check_operator_journey.py'
      - 'scripts/operator_artifact.py'
      - 'scripts/tests/test_operator_artifact.py'
      - 'pyproject.toml'
      - 'examples/curved-path-study/baseline.json'
      - 'instruments/manifest.json'
      - '.github/workflows/operator-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  candidate-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.identity.outputs.revision }}
      wheel_sha256: ${{ steps.identity.outputs.wheel_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test and wheel build dependencies
        run: python -c "import subprocess, sys, tomllib; p = tomllib.load(open('pyproject.toml', 'rb')); subprocess.run([sys.executable, '-m', 'pip', 'install', *p['build-system']['requires'], 'wheel', *p['project']['optional-dependencies']['dev']], check=True)"
      - name: Artifact identity and installed-byte refusal tests
        run: python -m pytest -q -o pythonpath= scripts/tests/test_operator_artifact.py --junitxml=operator-artifact-tests.xml
      - name: Build the single portable candidate wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - name: Seal the exact wheel and candidate revision
        id: identity
        shell: bash
        run: |
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          subprocess.run([sys.executable, 'scripts/operator_artifact.py', 'seal',
              '--wheel-dir', 'dist', '--manifest', 'dist/operator-wheel.json',
              '--revision', revision], check=True)
          manifest = json.loads(Path('dist/operator-wheel.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('revision=' + revision + '\n')
              stream.write('wheel_sha256=' + manifest['wheel_sha256'] + '\n')
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operator-candidate-wheel
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: operator-artifact-tests
          path: operator-artifact-tests.xml
          if-no-files-found: error
          retention-days: 14

  installed-journey:
    needs: candidate-wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Enable retained Windows source paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.candidate-wheel.outputs.revision }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: operator-candidate-wheel
          path: candidate-wheel
      - name: Validate candidate artifact before installation
        env:
          CANDIDATE_REVISION: ${{ needs.candidate-wheel.outputs.revision }}
          CANDIDATE_WHEEL_SHA256: ${{ needs.candidate-wheel.outputs.wheel_sha256 }}
        shell: bash
        run: python scripts/operator_artifact.py verify --wheel-dir candidate-wheel --manifest candidate-wheel/operator-wheel.json --revision "$CANDIDATE_REVISION" --sha256 "$CANDIDATE_WHEEL_SHA256"
      - name: Install the candidate and contract-test dependencies
        run: python -c "import pathlib, subprocess, sys; w = list(pathlib.Path('candidate-wheel').glob('*.whl')); assert len(w) == 1; subprocess.run([sys.executable, '-m', 'pip', 'install', str(w[0]) + '[dev]'], check=True)"
      - name: Operator contracts and refusal checks
        run: python -m pytest -q tests/test_operator_catalog.py tests/test_operator_doctor.py tests/test_operator_start.py tests/test_operator_provision.py tests/test_operator_workbench.py --junitxml=operator-tests.xml
      - name: Isolated installed journey and retained public provider
        env:
          CANDIDATE_REVISION: ${{ needs.candidate-wheel.outputs.revision }}
          CANDIDATE_WHEEL_SHA256: ${{ needs.candidate-wheel.outputs.wheel_sha256 }}
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess
          import sys
          root = Path.cwd()
          environment = Path(os.environ['RUNNER_TEMP']) / 'operator-environment'
          subprocess.run([sys.executable, '-m', 'venv', str(environment)], check=True)
          installed_python = environment / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          artifact = root / 'candidate-wheel'
          subprocess.run([sys.executable, str(root / 'scripts/operator_artifact.py'), 'verify',
              '--wheel-dir', str(artifact), '--manifest', str(artifact / 'operator-wheel.json'),
              '--revision', os.environ['CANDIDATE_REVISION'],
              '--sha256', os.environ['CANDIDATE_WHEEL_SHA256']], check=True)
          wheels = list(artifact.glob('*.whl'))
          if len(wheels) != 1:
              raise RuntimeError('Expected the single downloaded candidate wheel')
          subprocess.run([str(installed_python), '-m', 'pip', 'install', '--no-compile', str(wheels[0])], check=True)
          # Keep the retained provider checkout root short on Windows.
          output = Path(os.environ['RUNNER_TEMP']) / 'or'
          subprocess.run([str(installed_python), '-I', '-B', str(root / 'scripts/check_operator_journey.py'),
                          '--output-dir', str(output), '--monorepo', str(root),
                          '--wheel-manifest', str(artifact / 'operator-wheel.json'),
                          '--wheel-sha256', os.environ['CANDIDATE_WHEEL_SHA256'],
                          '--candidate-revision', os.environ['CANDIDATE_REVISION']],
                         cwd=Path(os.environ['RUNNER_TEMP']), check=True)
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: operator-readiness-${{ matrix.os }}
          path: |
            operator-tests.xml
            candidate-wheel/operator-wheel.json
            ${{ runner.temp }}/or/qualification.json
            ${{ runner.temp }}/or/commands/**
            ${{ runner.temp }}/or/workbench-*.log
            ${{ runner.temp }}/or/first-use/**
            ${{ runner.temp }}/or/blocked-first-use/**
            ${{ runner.temp }}/or/workbench/*.json
            ${{ runner.temp }}/or/curved-source.json
            ${{ runner.temp }}/or/curved-original/**
            ${{ runner.temp }}/or/curved-replay/**
            ${{ runner.temp }}/or/public-providers/*.json
          if-no-files-found: error
          retention-days: 14

  operator-acceptance:
    if: always()
    needs: [candidate-wheel, installed-journey]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the build and both platform journeys to complete
        env:
          BUILD_RESULT: ${{ needs.candidate-wheel.result }}
          JOURNEY_RESULT: ${{ needs.installed-journey.result }}
          CANDIDATE_REVISION: ${{ needs.candidate-wheel.outputs.revision }}
          CANDIDATE_WHEEL_SHA256: ${{ needs.candidate-wheel.outputs.wheel_sha256 }}
        run: |
          test "$BUILD_RESULT" = success
          test "$JOURNEY_RESULT" = success
          {
            echo "Both installed operator journeys used the same candidate wheel."
            echo "Revision: $CANDIDATE_REVISION"
            echo "Wheel SHA-256: $CANDIDATE_WHEEL_SHA256"
            echo "Scope: bounded synthetic operator journey and declared public-provider replay."
            echo "Human acceptance, private providers and physical validation remain separate."
          } >> "$GITHUB_STEP_SUMMARY"
