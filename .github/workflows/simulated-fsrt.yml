name: Simulated observation to FSRT
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-fsrt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Provision unchanged public FSRT pin and Godot 4.5.2
        id: provision-fsrt
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.monorepo import _retained, git, load_manifest, verify_imports, worktree_mutation_lock
          from scripts.provider_checkouts import validate_checkout
          root = Path.cwd()
          target = Path(os.environ['RUNNER_TEMP']) / 'fsrt'
          pin = '09a756dd9cdd3a9bb6cb14b5cd498f6259937ac2'
          verify_imports(root)
          module = next(item for item in load_manifest(root)['modules'] if item['role'] == 'fsrt')
          _retained(root, pin, module)
          with worktree_mutation_lock(root):
              git(root, 'worktree', 'add', '--detach', str(target), pin)
          validate_checkout(target, pin)
          PY
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          echo "87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.5.2-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.5.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          echo "CIW_FSRT_REPO=$RUNNER_TEMP/fsrt" >> "$GITHUB_ENV"
      - name: Existing reader regressions and synthetic source contracts
        run: python -m pytest -q tests/test_covariance_records.py tests/test_covariance_artifacts.py tests/test_simulated_fsrt.py -o addopts= --junitxml=source-contracts.xml
      - name: Real engine source and native FSRT path
        env:
          CIW_SIMULATED_FSRT_OUT: ${{ runner.temp }}/simulated-fsrt-evidence
        run: python -m pytest -q validation/simulated_fsrt_integration.py -o addopts= --junitxml=simulated-fsrt.xml
      - name: Require complete qualification
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites=list(ET.parse('simulated-fsrt.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites)==14
          assert all(int(s.attrib[k])==0 for s in suites for k in ('errors','failures','skipped'))
          PY
      - run: python -m build --wheel
      - name: Verify retained FSRT source and remove its temporary worktree
        if: ${{ always() && steps.provision-fsrt.outcome == 'success' }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.monorepo import git, worktree_mutation_lock
          from scripts.provider_checkouts import validate_checkout
          root = Path.cwd()
          target = Path(os.environ['RUNNER_TEMP']) / 'fsrt'
          try:
              validate_checkout(target, '09a756dd9cdd3a9bb6cb14b5cd498f6259937ac2')
          finally:
              with worktree_mutation_lock(root):
                  git(root, 'worktree', 'remove', '--force', str(target))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: simulated-fsrt-qualification
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/simulated-fsrt-evidence
            source-contracts.xml
            simulated-fsrt.xml
            dist/*.whl
