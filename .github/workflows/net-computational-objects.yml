name: NET computational object selection
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-selection:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Source selection and unchanged control contracts
        run: python -m pytest -q tests/test_computational_objects.py tests/test_computational_source.py tests/test_control_plane.py -o addopts= --junitxml=source-contracts.xml
      - run: python -m build --wheel
      - name: Installed wheel tests outside source imports
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tempfile
          root = pathlib.Path.cwd()
          wheel = next((root / 'dist').glob('*.whl'))
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)
          with tempfile.TemporaryDirectory() as directory:
              subprocess.run([sys.executable, '-I', '-m', 'pytest', '-q',
                  str(root / 'tests/test_computational_objects.py'), str(root / 'tests/test_computational_source.py'),
                  '-o', 'pythonpath=' + (root / 'tests').as_posix(), '-o', 'addopts=',
                  '--junitxml=' + str(root / 'source-installed.xml')], cwd=directory, check=True)
          PY
      - name: Real committed provider capture and offline view
        run: |
          net object capture --repo-root . --repository giasonpooni/Notations-Engineering-Terminal --revision HEAD --path src/ciw/adapters/oscillator.py --symbol compute_statistics --declaration examples/computational-objects/statistics.json --editable --output source-evidence/selection.json
          net object context source-evidence/selection.json --output source-evidence/context.json
          net object view source-evidence/selection.json --output source-evidence/inspector.html
      - name: Actual Chromium inspection
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python -I validation/source_selection_browser.py --html source-evidence/inspector.html --output-dir source-browser-evidence
      - name: Require every source-selection case
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          for path, count in [('source-contracts.xml', 188), ('source-installed.xml', 69)]:
              suites = list(ET.parse(path).getroot().iter('testsuite'))
              assert sum(int(s.attrib['tests']) for s in suites) == count
              assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures', 'errors', 'skipped'))
          if os.environ['RUNNER_OS'] == 'Linux':
              report = json.loads(pathlib.Path('source-browser-evidence/browser-report.json').read_text())
              assert report['status'] == 'passed' and report['count'] == 9
              assert not report['errors'] and not report['network_requests']
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-selection-${{ matrix.os }}
          if-no-files-found: error
          path: |
            source-contracts.xml
            source-installed.xml
            source-evidence
            source-browser-evidence
            dist/*.whl
