name: Legibility instrument
on:
  push:
    branches: [main, 'release/**']
    tags: ['**']
  pull_request:
    paths:
      - 'src/ciw/**'
      - 'tests/test_legibility*.py'
      - 'tests/test_capabilities.py'
      - 'tests/test_doctor*.py'
      - 'scripts/check_operator_installed.py'
      - 'pyproject.toml'
      - '.github/workflows/legibility.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  boundary-and-installed-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,legibility]"
      - run: python -c "import pathlib, pytest; raise SystemExit(pytest.main([str(p) for p in sorted(pathlib.Path('tests').glob('test_legibility*.py'))] + ['tests/test_capabilities.py', 'tests/test_protocol.py', 'tests/test_doctor.py', 'tests/test_doctor_legibility.py', '--junitxml=results/legibility-source.xml']))"
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python -m pip uninstall -y computational-instrumentation-workbench
      - name: Install wheel and exercise outside source tree
        run: |
          python -c "import pathlib, subprocess, sys; subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', str(next(pathlib.Path('dist').glob('*.whl')))], check=True)"
          python -c "import os, pathlib, subprocess, sys, tempfile; d=pathlib.Path(tempfile.mkdtemp()); env=dict(os.environ); env.pop('PYTHONPATH', None); subprocess.run([sys.executable, '-m', 'ciw', 'legibility', 'demo', '--output-dir', str(d/'specimen')], cwd=d, env=env, check=True); subprocess.run([sys.executable, '-m', 'ciw', 'legibility', 'verify', str(d/'specimen'), '--trust', str(d/'specimen'/'demo-trust.json'), '--expected-version', '1'], cwd=d, env=env, check=True)"
      - name: Check installed public operator workflows
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          source = Path.cwd().resolve()
          wheels = list((source / "dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit("Expected exactly one candidate wheel")
          subprocess.run([
              sys.executable, "-I", str(source / "scripts" / "check_operator_installed.py"),
              "--output-dir", str(Path(os.environ["RUNNER_TEMP"]) / "net-operator-installed"),
              "--expected-wheel", str(wheels[0].resolve()),
          ], check=True)
      - name: Retain installed operator evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legibility-operator-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/net-operator-installed/
            results/legibility-source.xml
            dist/*.whl
          if-no-files-found: error
