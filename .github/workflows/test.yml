name: Prototype checks

on:
  push:
    branches: [main, 'release/**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve long paths and exact fixture bytes
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  plsr-terminal:
    env:
      CIW_PROVIDER_READ_TOKEN: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'workflow_dispatch') && secrets.CIW_PROVIDER_READ_TOKEN || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure read-only private-provider access
        run: python scripts/ci_provider_access.py configure
      - name: Install pinned optional instrument and run adapter tests
        run: |
          python -m pip install -e ".[dev,plsr]"
          python -m pytest -q tests/test_plsr.py tests/test_plsr_engine.py
      - name: Build and install the workbench wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip uninstall -y computational-instrumentation-workbench
          python -c "import pathlib, subprocess, sys; subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', str(next(pathlib.Path('dist').glob('*.whl')))], check=True)"
      - name: Exercise retained evidence and replay outside the checkout
        run: python scripts/check_plsr_installed.py

  installed-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build installable wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Install and exercise wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/ciw-installed"
          "$RUNNER_TEMP/ciw-installed/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/ciw-installed/bin/python" scripts/check_installed.py
      - uses: actions/upload-artifact@v4
        with:
          name: ciw-python-wheel
          path: dist/*.whl

  container-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Build, deploy, restart and verify persisted workspace
        run: python scripts/check_container.py

  native-windows-deployment:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up the local service environment
        shell: pwsh
        run: ./scripts/workbench.ps1 Setup -PythonExecutable (Get-Command python).Source
      - name: Verify owned-process start, stop and persisted restart
        shell: pwsh
        run: ./scripts/check_local.ps1

  godot-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download pinned Godot Standard
        run: |
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.5.2' --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.5.2-stable_linux.x86_64"
      - name: Import project and exercise both WebSocket clients
        run: python scripts/check_godot.py --godot "$RUNNER_TEMP/godot/Godot_v4.5.2-stable_linux.x86_64"
