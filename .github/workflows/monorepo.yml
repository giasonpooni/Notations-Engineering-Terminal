name: Public engineering superrepo qualification

on:
  push:
    branches: [main, 'release/**']
    tags: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      flowstate_full_reproduction:
        description: Also run the public FlowState slow reproduction lane
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-history-and-migration-guards:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    steps:
      - name: Preserve exact fixture bytes and Windows long paths
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original Terminal test dependencies
        run: python -m pip install 'numpy==2.4.3' 'websockets==16.0' 'pytest==9.0.2'
      - name: Audit preserved source histories and identities
        shell: bash
        run: |
          mkdir -p results/monorepo-audit
          python scripts/superrepo.py list --json > results/monorepo-audit/modules.json
          python scripts/monorepo.py > results/monorepo-audit/source-audit.json
          python -m pytest -vv --tb=short tests/test_monorepo.py tests/test_superrepo.py tests/test_worktree_lock.py tests/test_superrepo_doctor.py tests/test_module_update.py --junitxml results/monorepo-audit/migration-tests.xml
      - name: Show retained reports for evidence review
        if: always()
        run: >-
          python scripts/show_qualification_reports.py
          results/monorepo-audit/modules.json
          results/monorepo-audit/source-audit.json
      - name: Retain source audit and migration guards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-source-audit-${{ matrix.os }}
          path: results/monorepo-audit/
          if-no-files-found: error

  independent-wheels-and-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install wheel build tooling
        run: python -m pip install 'setuptools>=77' wheel
      - name: Qualify independent packages and the existing two-provider adapter
        run: python scripts/check_monorepo.py --output-dir results/monorepo
      - name: Show retained reports for evidence review
        if: always()
        run: >-
          python scripts/show_qualification_reports.py
          results/monorepo/report.json
          results/monorepo/composition.json
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-qualification-python-${{ matrix.python }}
          path: results/monorepo/
          if-no-files-found: error

  inference-and-public-process-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install wheel build tooling
        run: python -m pip install 'setuptools>=77' wheel
      - name: Qualify public inference packages and full original process replay
        run: python scripts/check_monorepo_inference.py --output-dir results/monorepo-inference
      - name: Show retained reports for evidence review
        if: always()
        run: >-
          python scripts/show_qualification_reports.py
          results/monorepo-inference/report.json
          results/monorepo-inference/composition.json
      - name: Retain inference qualification evidence and sessions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-inference-python-${{ matrix.python }}
          path: results/monorepo-inference/
          if-no-files-found: error

  mathematics-and-measurement-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install wheel build tooling
        run: python -m pip install 'setuptools>=77' wheel
      - name: Qualify independent mathematical packages and exact measurement chains
        run: python scripts/check_monorepo_math.py --output-dir results/monorepo-math
      - name: Show retained reports for evidence review
        if: always()
        run: >-
          python scripts/show_qualification_reports.py
          results/monorepo-math/report.json
          results/monorepo-math/composition.json
          results/monorepo-math/jspt-endpoint.json
          results/monorepo-math/stfe-endpoint.json
      - name: Retain mathematical qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-math-python-${{ matrix.python }}
          path: results/monorepo-math/
          if-no-files-found: error

  flowstate-wheel-and-original-default-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install wheel build tooling
        run: python -m pip install 'setuptools>=77' wheel
      - name: Qualify FlowState wheel and unchanged default source suite
        run: python scripts/check_monorepo_flowstate.py --output-dir results/monorepo-flowstate
      - name: Show retained reports for evidence review
        if: always()
        run: >-
          python scripts/show_qualification_reports.py
          results/monorepo-flowstate/report.json
          results/monorepo-flowstate/wheel-numerics.json
      - name: Retain FlowState qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-flowstate-python-${{ matrix.python }}
          path: results/monorepo-flowstate/
          if-no-files-found: error

  flowstate-public-slow-reproduction:
    if: github.event_name == 'workflow_dispatch' && inputs.flowstate_full_reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install wheel build tooling
        run: python -m pip install 'setuptools>=77' wheel
      - name: Run additional original public FlowState reproductions
        run: python scripts/check_monorepo_flowstate.py --full-reproduction --output-dir results/monorepo-flowstate-full
      - name: Show retained reports for evidence review
        if: always()
        run: >-
          python scripts/show_qualification_reports.py
          results/monorepo-flowstate-full/report.json
          results/monorepo-flowstate-full/wheel-numerics.json
      - name: Retain full public reproduction evidence and private exclusions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-flowstate-public-full-python-3.12
          path: results/monorepo-flowstate-full/
          if-no-files-found: error

  surface-science-lock-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install wheel and original locked-lane tooling
        run: python -m pip install 'setuptools>=77' wheel uv
      - name: Qualify Surface science, regenerated artifacts, locked contracts and exact replay
        run: python scripts/check_monorepo_surface.py --output-dir results/monorepo-surface
      - name: Show retained reports for evidence review
        if: always()
        run: >-
          python scripts/show_qualification_reports.py
          results/monorepo-surface/report.json
          results/monorepo-surface/surface-determinism.json
      - name: Retain Surface qualification evidence and regenerated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-surface-python-${{ matrix.python }}
          path: results/monorepo-surface/
          if-no-files-found: error

  operations-resources-and-bounded-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.90.0'
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install original bounded CPU toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Install wheel build tooling
        run: python -m pip install 'setuptools>=77' wheel
      - name: Qualify package, budget, composition and bounded CPU execution
        run: python scripts/check_monorepo_operations.py --output-dir results/monorepo-operations
      - name: Show retained reports for evidence review
        if: always()
        run: >-
          python scripts/show_qualification_reports.py
          results/monorepo-operations/report.json
          results/monorepo-operations/composition.json
      - name: Retain operations, resource and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-operations-python-${{ matrix.python }}-rust-1.90.0
          path: results/monorepo-operations/
          if-no-files-found: error

  independent-locked-web-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Qualify original npm locks, hermetic tests, types and builds
        run: python scripts/check_monorepo_web.py --output-dir results/monorepo-web
      - name: Show retained reports for evidence review
        if: always()
        run: >-
          python scripts/show_qualification_reports.py
          results/monorepo-web/report.json
      - name: Retain independent web package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-web-node-24
          path: results/monorepo-web/
          if-no-files-found: error
